apply plugin: 'com.android.application'

def bundleModel = project.findProperty('hexBundleModel')?.toString()?.toBoolean() ?: false

android {
  namespace 'anomaly.hex.android'
  compileSdk 35

  defaultConfig {
    applicationId 'anomaly.hex.android'
    minSdk 33
    targetSdk 35
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner 'anomaly.hex.android.DictationReplayTest'
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  if (bundleModel) {
    sourceSets.main.assets.srcDirs += [rootProject.file('model')]
  }

  androidResources {
    noCompress += ['onnx']
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation files('libs/sherpa.aar')
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
  implementation 'com.google.mlkit:text-recognition:16.0.1'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
